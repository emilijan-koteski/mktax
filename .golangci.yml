version: "2"
linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nolintlint
  exclusions:
    paths:
      - testdata
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/emilijan-koteski/mktax
